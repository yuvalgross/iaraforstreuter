name: Fetch Wix images (one-off)
on:
  push:
    paths:
      - .github/workflows/fetch-wix.yml
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images from Wix
        run: |
          mkdir -p projects/img/wix
          curl -fsSL -H "Accept: image/png,image/jpeg" -o "projects/img/wix/newsletter-2.png" "https://static.wixstatic.com/media/7d88fb_345c08ac41f34152bd78762c2a8d10fe~mv2.png/v1/fill/w_942,h_1290,al_c,q_85,enc_auto/newsletter-2.png"
          curl -fsSL -H "Accept: image/png,image/jpeg" -o "projects/img/wix/leibniz-process.jpg" "https://static.wixstatic.com/media/7d88fb_a4981b0198184d6894e4d56217f71777~mv2.jpg/v1/fill/w_1816,h_1000,al_c,q_85,enc_auto/leibniz-process.jpg"
          curl -fsSL -H "Accept: image/png,image/jpeg" -o "projects/img/wix/painting-1.jpg" "https://static.wixstatic.com/media/7d88fb_a8a9c61f464143d98a6efd7d1cee0771~mv2.jpg/v1/fill/w_1200,h_804,al_c,q_85,enc_auto/painting-1.jpg"
          curl -fsSL -H "Accept: image/png,image/jpeg" -o "projects/img/wix/newsletter-3.png" "https://static.wixstatic.com/media/7d88fb_cd7b2c6e9d9b4353ad8c42a9b120f38a~mv2.png/v1/fill/w_850,h_1200,al_c,q_85,enc_auto/newsletter-3.png"
          curl -fsSL -H "Accept: image/png,image/jpeg" -o "projects/img/wix/thesis-cover.png" "https://static.wixstatic.com/media/7d88fb_e6635a52078f4b4ea696a76e46d2cd5d~mv2.png/v1/crop/x_3,y_195,w_1287,h_1631/fill/w_846,h_1072,al_c,q_85,enc_auto/thesis-cover.png"
          curl -fsSL -H "Accept: image/png,image/jpeg" -o "projects/img/wix/ill-1.png" "https://static.wixstatic.com/media/7d88fb_e683f29cedda416997bcf104b9241348~mv2.png/v1/crop/x_67,y_128,w_695,h_395/fill/w_870,h_506,al_c,q_85,enc_auto/ill-1.png"
          curl -fsSL -H "Accept: image/png,image/jpeg" -o "projects/img/wix/thesis-tools.png" "https://static.wixstatic.com/media/7d88fb_f7b69d6648064bcba5cf10107f015783~mv2.png/v1/crop/x_0,y_0,w_2027,h_1344/fill/w_1186,h_786,al_c,q_85,enc_auto/thesis-tools.png"
          curl -fsSL -H "Accept: image/png,image/jpeg" -o "projects/img/wix/ill-10.png" "https://static.wixstatic.com/media/7d88fb_fea412e97fc544618553c46b488d803a~mv2.png/v1/crop/x_63,y_120,w_712,h_346/fill/w_712,h_346,al_c,q_85,enc_auto/ill-10.png"
          ls -la projects/img/wix
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add projects/img/wix
          git commit -m "Add Wix images as local files"
          git push
